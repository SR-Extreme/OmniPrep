# OmniPrep — local Judge0 CE only (development).
# NOT used for OmniPrep API/frontend. Neon + Upstash stay cloud-hosted.
#
# Production: deploy Judge0 CE on Railway; set JUDGE0_BASE_URL on the backend.
#
# Requires: infra/judge0/judge0.conf (next file in this workflow)
#
# Start:
#   docker compose -f docker-compose.judge0.yml up -d
#
# Health:
#   curl http://localhost:2358/about
#
# Stop:
#   docker compose -f docker-compose.judge0.yml down

name: omniprep-judge0

services:
  server:
    image: judge0/judge0:latest
    volumes:
      - ./infra/judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: unless-stopped
    depends_on:
      - db
      - redis

  worker:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    volumes:
      - ./infra/judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    depends_on:
      - db
      - redis

  db:
    image: postgres:16.2
    env_file:
      - ./infra/judge0/judge0.conf
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data/
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    command:
      - bash
      - -c
      - 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    env_file:
      - ./infra/judge0/judge0.conf
    restart: unless-stopped

volumes:
  judge0-postgres-data: