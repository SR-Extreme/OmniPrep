################################################################################
# OmniPrep - local Judge0 CE configuration (development only)
# Production: configure on Railway-hosted Judge0 CE, not this file.
################################################################################

################################################################################
# Redis (Judge0 internal queue - separate from Upstash)
################################################################################
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=omniprep_judge0_redis_dev

################################################################################
# PostgreSQL (Judge0 internal DB - separate from Neon)
################################################################################
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=omniprep_judge0_pg_dev

################################################################################
# Authentication (disabled for local CE - matches empty JUDGE0_API_KEY)
################################################################################
# AUTHN_HEADER=X-Auth-Token
# AUTHN_TOKEN=

################################################################################
# Submission defaults (can tune per-request from OmniPrep Judge0Service)
################################################################################
ENABLE_WAIT_RESULT=true
CPU_TIME_LIMIT=5
WALL_TIME_LIMIT=10
MEMORY_LIMIT=256000
